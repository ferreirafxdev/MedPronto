services:
  - type: web
    name: medpronto-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123
      - key: S3_ENDPOINT
        value: https://bfada6f05278181875b5d34342012236.r2.cloudflarestorage.com
      - key: S3_REGION
        value: enam
      - key: S3_BUCKET
        value: prontuarios
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"