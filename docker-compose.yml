version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL (Prontuários, Usuários, Consultas e Atestados)
  postgres:
    image: postgres:15-alpine
    container_name: medpronto_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-medpronto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medpronto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-medpronto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Cache e Fila de Atendimento em Tempo Real (BullMQ + Socket.io)
  redis:
    image: redis:7-alpine
    container_name: medpronto_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - medpronto_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Servidor WebRTC (Utilizando LiveKit Cloud gerenciado)
  # livekit:
  #   image: livekit/livekit-server:latest
  #   container_name: medpronto_livekit
  #   restart: always
  #   ports:
  #     - "7880:7880"
  #     - "7881:7881"
  #     - "50000-60000:50000-60000/udp"

  # 4. Backend (API Node.js + WebSocket Socket.io + Worker PDF)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpronto_backend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-medpronto}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretmedpronto2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOADS_DIR: /app/uploads
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - medpronto_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Frontend (React Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
        VITE_VIDEOSDK_TOKEN: ${VITE_VIDEOSDK_TOKEN:-}
        VITE_TURN_SERVER: ${VITE_TURN_SERVER:-}
        VITE_TURN_USERNAME: ${COTURN_USER:-user}
        VITE_TURN_PASSWORD: ${COTURN_PASSWORD:-password}
        VITE_TRTC_SDK_APP_ID: ${VITE_TRTC_SDK_APP_ID:-0}
        VITE_TRTC_SDK_SECRET_KEY: ${VITE_TRTC_SDK_SECRET_KEY:-}
    container_name: medpronto_frontend
    restart: always
    networks:
      - medpronto_network
    depends_on:
      - backend


  # 6. Gateway HTTPS SSL Automático (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: medpronto_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@medpronto.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - medpronto_network
    depends_on:
      - frontend
      - backend

networks:
  medpronto_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
